[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "revelado-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code, Claude Desktop or any MCP client drive the local Revelado RAW developer"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Jorge Luis Peña Sanchez" }]
keywords = ["mcp", "model-context-protocol", "raw", "photography", "photo-culling", "film-emulation", "revelado"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pillow>=10.3",
  "anyio>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Blue-Studio-Lab/Revelado"
Source = "https://github.com/Blue-Studio-Lab/Revelado/tree/main/mcp"
Issues = "https://github.com/Blue-Studio-Lab/Revelado/issues"

[project.scripts]
revelado-mcp = "revelado_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revelado_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "manifest.json", "plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
