# Documentation site config. Read natively by Zensical (https://zensical.org, MIT, by the Material for MkDocs team;
# v0.1.x "Beta" as of Nov 2026) and, as a fallback, by MkDocs + mkdocs-material 9.7.x (maintenance mode).
#   pip install zensical && zensical serve          # preview (not run in CI yet)
# Zensical's docs advise keeping mkdocs.yml (rather than zensical.toml) for now; it is supported indefinitely.
site_name: Revelado
site_description: Develop your RAW photos like a film lab.
site_url: https://blue-studio-lab.github.io/Revelado/
repo_url: https://github.com/Blue-Studio-Lab/Revelado
repo_name: Blue-Studio-Lab/Revelado
edit_uri: edit/main/docs/
copyright: Copyright © 2026 Jorge Luis Peña Sanchez and the Revelado contributors · GPL-3.0-or-later
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - User manual:
      - Overview: en/manual/index.md
      - Install: en/manual/install.md
      - Import: en/manual/import.md
      - Viewer and masks: en/manual/viewer.md
      - Culling: en/manual/culling.md
      - Develop: en/manual/develop.md
      - Oven (batch): en/manual/oven.md
      - Export: en/manual/export.md
      - Rescue (coming): en/manual/rescue.md
      - Recipes and CLI: en/manual/recipes-cli.md
      - AI options: en/manual/ai.md
      - MCP: en/manual/mcp.md
  - Manual (español):
      - Índice: es/manual/index.md
      - Instalación: es/manual/instalacion.md
      - Importar: es/manual/importar.md
      - Visor y máscaras: es/manual/visor.md
      - Selección: es/manual/seleccion.md
      - Cuarto oscuro: es/manual/cuarto-oscuro.md
      - Horno: es/manual/horno.md
      - Exportar: es/manual/exportar.md
      - Rescate (próximamente): es/manual/rescate.md
      - Recetas y CLI: es/manual/recetas-cli.md
      - Opciones de IA: es/manual/ia.md
      - MCP: es/manual/mcp.md
  - Technical:
      - Overview: technical/index.md
      - Noise reduction: technical/noise-reduction.md
      - Chromatic aberration: technical/chromatic-aberration.md
      - Exposure for log profiles: technical/exposure-log-profiles.md
      - Film model: technical/film-model.md
      - Retouch: technical/retouch.md
      - Hair clean-up: technical/hair.md
      - Reframing: technical/reframing.md
      - Determinism and recipes: technical/determinism-and-recipes.md
      - Memory and scheduling: technical/memory-scheduling.md
      - Benchmarks: technical/BENCHMARKS.md
