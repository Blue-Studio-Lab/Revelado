# SPDX-License-Identifier: GPL-3.0-or-later
# Lint, typecheck and test the Python engine (3 OS x Python 3.12-3.14) and build the web app.
# Fork PRs run with a read-only token and no secrets (pull_request, never pull_request_target).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PY_PACKAGE: revelado            # import package inside engine/
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # Tests must never reach private folders or the network.
  REVELADO_DEV: "0"

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev,ai]" ruff mypy
      - name: Lint (ruff)
        # Correctness rules only for now; style rules are tightened in engine/pyproject.toml over time.
        run: ruff check engine --select E9,F63,F7,F82,F401,F811,F821,B006,B008 --output-format=github
      - name: Typecheck (mypy)
        # Non-blocking until the engine is fully annotated (tracked in CHANGELOG); results stay visible.
        continue-on-error: true
        run: mypy --ignore-missing-imports --no-error-summary -p "$PY_PACKAGE"
      - name: Tests
        working-directory: engine
        run: python -m pytest -q -p no:cacheprovider --durations=10

  mcp:
    name: mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install revelado-mcp
        run: python -m pip install -e "mcp[dev]"
      - name: Lint
        run: ruff check mcp/src mcp/tests --output-format=github
      - name: Tests (fake engine, no network)
        working-directory: mcp
        run: python -m pytest -q -p no:cacheprovider

  web:
    name: web (build + typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  workflows:
    name: workflow lint (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false   # print findings and fail; no SARIF upload (works on fork PRs)
          online-audits: false

  # Single required check for branch protection: green only when every job above is green.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [python, mcp, web, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
