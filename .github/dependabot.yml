version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(engine)" }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /mcp
    schedule: { interval: weekly, day: monday }
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(mcp)" }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(web)" }
    open-pull-requests-limit: 5
