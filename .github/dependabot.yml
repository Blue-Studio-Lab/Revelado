version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }   # let new releases age a week before proposing them (supply-chain hygiene)
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }   # let new releases age a week before proposing them (supply-chain hygiene)
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(engine)" }
    ignore:   # major versions are migrated by hand in their own branch, with tests
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /mcp
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }   # let new releases age a week before proposing them (supply-chain hygiene)
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(mcp)" }
    ignore:   # major versions are migrated by hand in their own branch, with tests
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }   # let new releases age a week before proposing them (supply-chain hygiene)
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(web)" }
    ignore:   # major versions are migrated by hand in their own branch, with tests
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
