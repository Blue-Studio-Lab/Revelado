<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Revelado</title>
  <desc id="d">Placeholder cover banner: a strip of film sinking into a developing tray, with the Revelado wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#0d0a08"/>
    </linearGradient>
    <linearGradient id="bath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2a1c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3b120b" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="sprockets" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect x="7" y="5" width="14" height="10" rx="2.5" fill="#0d0a08"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- safelight glow -->
  <circle cx="1140" cy="70" r="140" fill="#c0392b" opacity="0.10"/>
  <!-- film strip, slightly tilted, dipping into the tray -->
  <g transform="rotate(-6 640 200)">
    <rect x="80" y="110" width="1120" height="120" fill="#d9a441"/>
    <rect x="80" y="112" width="1120" height="20" fill="url(#sprockets)"/>
    <rect x="80" y="208" width="1120" height="20" fill="url(#sprockets)"/>
    <g fill="#2a1d12">
      <rect x="110" y="138" width="150" height="64" rx="3"/>
      <rect x="280" y="138" width="150" height="64" rx="3"/>
      <rect x="450" y="138" width="150" height="64" rx="3"/>
      <rect x="620" y="138" width="150" height="64" rx="3"/>
      <rect x="790" y="138" width="150" height="64" rx="3"/>
      <rect x="960" y="138" width="150" height="64" rx="3"/>
    </g>
    <!-- frames get lighter = "developing" left to right -->
    <g fill="#f3e3c3">
      <rect x="790" y="138" width="150" height="64" rx="3" opacity="0.25"/>
      <rect x="960" y="138" width="150" height="64" rx="3" opacity="0.55"/>
    </g>
  </g>
  <!-- developing tray -->
  <path d="M120 300 L1160 300 L1120 372 L160 372 Z" fill="#2c2c2c"/>
  <path d="M140 304 L1140 304 L1108 362 L172 362 Z" fill="url(#bath)"/>
  <path d="M180 322 q60 -8 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" stroke="#e8b4a8" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  <!-- wordmark -->
  <text x="640" y="290" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="2" fill="#f6efe4">Revelado</text>
  <text x="640" y="392" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#b9a891" opacity="0.9">develop your RAW photos like a film lab — placeholder banner</text>
</svg>
